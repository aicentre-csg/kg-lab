      <path d="M193 275 L193 394 L195 475" stroke="#292f7d"/>
      <path d="M193 275 L243 342 L343 465" stroke="#292f7d"/>
      <path d="M193 394 L343 465" stroke="#292f7d"/>
      <path d="M193 394 L323 275" stroke="#244caf"/>
      <path d="M195 475 L243 342 L323 275" stroke="#1f4daf"/>
      <path d="M243 342 L323 275" stroke="#234db1"/>

