      <circle cx="193" cy="275" r="19.5" fill="#29317f"/>
      <circle cx="193" cy="394" r="20" fill="#29317f"/>
      <circle cx="195" cy="475" r="20" fill="#159fbc"/>
      <circle cx="243" cy="342" r="20" fill="#244bb0"/>
      <circle cx="323" cy="275" r="20" fill="#244db0"/>
      <circle cx="343" cy="465" r="20" fill="#29317f"/>

      <!-- G nodes -->
      <circle cx="369" cy="372" r="20" fill="#159fbc"/>
      <circle cx="424" cy="298" r="20" fill="#29317f"/>
      <circle cx="501" cy="274" r="20" fill="#1377bd"/>
      <circle cx="580" cy="300" r="20" fill="#159fbc"/>
      <circle cx="400" cy="475" r="20" fill="#29317f"/>
      <circle cx="458" cy="483" r="20" fill="#244bb0"/>
