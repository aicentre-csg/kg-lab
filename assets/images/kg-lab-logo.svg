<svg xmlns="http://www.w3.org/2000/svg" width="767" height="900" viewBox="0 0 767 900" role="img" aria-labelledby="title desc">
  <title id="title">KG Lab network logo</title>
  <desc id="desc">The network-based KG symbol with a KG Lab wordmark below it.</desc>

  <rect width="767" height="900" fill="#ffffff"/>

  <!-- Network-based KG symbol -->
  <g transform="translate(0 -55)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
