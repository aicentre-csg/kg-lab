      <path d="M369 372 L424 298 L501 274 L580 300" stroke="#283080"/>
      <path d="M369 372 L501 274" stroke="#204dad"/>
      <path d="M424 298 L400 475 L458 483" stroke="#273080"/>
      <path d="M369 372 L400 475" stroke="#149ab8"/>
      <path d="M369 372 L458 483" stroke="#1851a8"/>
      <path d="M458 483 L576 473" stroke="#1d4eb0"/>
      <path d="M458 492 L576 473" stroke="#2449aa"/>
      <path d="M503 395 L583 396 L576 473" stroke="#292f7d"/>
      <path d="M503 395 L576 473" stroke="#292f7d"/>
      <path d="M458 483 L583 396" stroke="#263180"/>
    </g>

    <g>
